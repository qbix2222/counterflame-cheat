name: Build CounterFlame Cheat

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Clone ImGui
        run: git clone --depth 1 https://github.com/ocornut/imgui.git

      - name: List ImGui backends
        run: ls -la imgui/backends/

      - name: Build dylib (arm64 iOS)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Найти правильный файл бэкенда Metal
          METAL_BACKEND=""
          if [ -f "imgui/backends/imgui_impl_metal.mm" ]; then
            METAL_BACKEND="imgui/backends/imgui_impl_metal.mm"
          elif [ -f "imgui/backends/imgui_impl_metal.cpp" ]; then
            METAL_BACKEND="imgui/backends/imgui_impl_metal.cpp"
          else
            echo "ERROR: No Metal backend found in imgui/backends/"
            exit 1
          fi
          echo "Using Metal backend: $METAL_BACKEND"

          clang++ -arch arm64 -isysroot "$SDK" \
            -I. -I./imgui -I./imgui/backends \
            -framework Metal -framework QuartzCore -framework UIKit -framework Foundation \
            -std=c++20 -O2 -fvisibility=hidden -shared \
            cheat.cpp menu.cpp main.cpp \
            imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
            $METAL_BACKEND \
            -o CounterFlameCheat.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: counterflame-cheat-dylib
          path: CounterFlameCheat.dylib
          retention-days: 7
