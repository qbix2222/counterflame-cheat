name: Build CounterFlame Cheat

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

env:
  BUNDLE_ID: com.ScarletWork.CounterFlame
  IPA_NAME: CounterFlame-1.3.0.1.ipa
  OUTPUT_IPA: CounterFlame-Cheat-1.3.0.1.ipa

jobs:
  build-and-package:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Clone ImGui
      - name: Clone ImGui
        run: git clone --depth 1 https://github.com/ocornut/imgui.git

      # 3. Build Dobby (static library for iOS arm64)
      - name: Build Dobby (static library for iOS arm64)
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          cd Dobby
          mkdir -p build_for_ios_arm64 && cd build_for_ios_arm64
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=9.3 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF
          make -j4
          echo "Dobby static library built."
          find . -name "libdobby.a"

      # 4. Build dylib (arm64 iOS)
      - name: Build dylib (arm64 iOS)
        run: |
          chmod +x build.sh
          ./build.sh

      # 4.5 Download IPA from release assets
      - name: Download base IPA from release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          gh release download --repo ${{ github.repository }} --pattern "${{ env.IPA_NAME }}" --dir .
          if [ ! -f "${{ env.IPA_NAME }}" ]; then
            echo "ERROR: IPA not found in release assets. Please upload ${IPA_NAME} to the release."
            exit 1
          fi
          echo "IPA downloaded successfully"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Install injection tools (optool + insert_dylib)
      - name: Install injection tools
        run: |
          # Install optool
          git clone --depth 1 https://github.com/alexzielenski/optool.git
          cd optool
          xcodebuild -project optool.xcodeproj -target optool -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          cp -f build/Release/optool /usr/local/bin/
          cd ..

          # Install insert_dylib as backup
          git clone --depth 1 https://github.com/Tyilo/insert_dylib
          cd insert_dylib
          make
          cp -f insert_dylib /usr/local/bin/
          cd ..

          # Verify tools
          optool -h
          insert_dylib --help

      # 5. Extract IPA
      - name: Extract IPA
        run: |
          unzip -q CounterFlame-1.3.0.1.ipa -d Payload
          ls -la Payload/

      # 6. Inject dylib into main binary
      - name: Inject dylib into main binary
        run: |
          # Inject into main executable
          insert_dylib --inplace @rpath/Frameworks/CounterFlameCheat.dylib Payload/CounterFlame.app/CounterFlame
          
          # Also inject into UnityFramework
          insert_dylib --inplace @rpath/Frameworks/CounterFlameCheat.dylib \
            Payload/CounterFlame.app/Frameworks/UnityFramework.framework/UnityFramework

      # 7. Copy dylib into app bundle
      - name: Copy dylib into app bundle
        run: |
          mkdir -p Payload/CounterFlame.app/Frameworks
          cp CounterFlameCheat.dylib Payload/CounterFlame.app/Frameworks/

      # 7. Create entitlements.plist
      - name: Create entitlements.plist
        run: |
          cat > entitlements.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>${{ secrets.APPLE_TEAM_ID }}.com.ScarletWork.CounterFlame</string>
            <key>com.apple.developer.team-identifier</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>get-task-allow</key>
            <true/>
            <key>com.apple.security.get-task-allow</key>
            <true/>
            <key>com.apple.security.cs.debugger</key>
            <true/>
          </dict>
          </plist>
          EOF

      # 8. Re-sign all binaries and app bundle
      - name: Re-sign app bundle
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Import certificate
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          
          # Set keychain partition list
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          # Find identity
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | head -1 | awk -F '"' '{print $2}')
          echo "Using identity: $IDENTITY"
          
          # Re-sign all dylibs and frameworks first
          find Payload/CounterFlame.app -name "*.dylib" -o -name "*.framework" | while read f; do
            codesign --force --sign "$IDENTITY" --timestamp=none --deep "$f" 2>/dev/null || true
          done
          
          # Re-sign main executable
          codesign --force --sign "$IDENTITY" --timestamp=none --deep Payload/CounterFlame.app/CounterFlame
          
          # Re-sign UnityFramework
          codesign --force --sign "$IDENTITY" --timestamp=none --deep \
            Payload/CounterFlame.app/Frameworks/UnityFramework.framework/UnityFramework
          
          # Re-sign all embedded frameworks
          find Payload/CounterFlame.app/Frameworks -name "*.framework" -exec codesign --force --sign "$IDENTITY" --timestamp=none --deep {} \;
          
          # Re-sign the app bundle itself
          codesign --force --sign "$IDENTITY" --timestamp=none --deep \
            --entitlements entitlements.plist Payload/CounterFlame.app

      # 8. Re-package IPA
      - name: Re-package IPA
        run: |
          cd Payload
          zip -qr ../CounterFlame-Cheat-1.3.0.1.ipa CounterFlame.app
          cd ..
          ls -la CounterFlame-Cheat-1.3.0.1.ipa

      # 9. Verify IPA
      - name: Verify IPA
        run: |
          unzip -l CounterFlame-Cheat-1.3.0.1.ipa | head -20
          echo "IPA size: $(du -h CounterFlame-Cheat-1.3.0.1.ipa)"

      # 10. Upload final IPA
      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: counterflame-cheat-ipa
          path: CounterFlame-Cheat-1.3.0.1.ipa
          retention-days: 7

      # 11. Also upload dylib for reference
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: counterflame-cheat-dylib
          path: CounterFlameCheat.dylib
          retention-days: 7